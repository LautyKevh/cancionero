<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cancionero IBSI MAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: sereno, práctico, para leer en el escenario
   IDEA: la hoja de acordes impresa del atril, con su encabezado de tono
   PICTURE: la propia hoja de la canción, grande y legible
   COLOUR and TYPE: papel cálido / noche azul tinta, acordes en azul profundo; Fraunces títulos, Inter, JetBrains Mono para la hoja
   LAYOUT: lista → elegir modo → hoja con barra de controles fija abajo */
:root{color-scheme:light dark;--bg:light-dark(#faf7f2,#12161f);--card:light-dark(#fff,#1a2030);--ink:light-dark(#1d1b19,#ece8e1);--mute:light-dark(#6d675f,#9aa1ae);--line:light-dark(#e6e0d6,#2a3244);--ch:light-dark(#1f4fbf,#7fb0ff);--acc:light-dark(#c2410c,#ff9a5c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
header{padding:22px max(5vw,16px) 8px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font:600 clamp(26px,5vw,38px)/1.05 Fraunces,Georgia,serif;margin:0}
.sub{color:var(--mute);font-size:14px}
main{padding:8px max(5vw,16px) 48px;max-width:900px;margin:0 auto}
input[type=search]{width:100%;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.list{list-style:none;padding:0;margin:14px 0}
.list li:not(.ed)>button{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:12px;width:100%;padding:14px 4px;border-bottom:1px solid var(--line)}
.list b{font-weight:600}.list small{color:var(--mute);display:block;font-size:13px}
.key{font:700 15px 'JetBrains Mono',monospace;color:var(--ch);white-space:nowrap;align-self:center}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}
.mode button{font:600 18px Inter;padding:22px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.mode small{display:block;font:400 13px Inter;color:var(--mute);margin-top:4px}
.back{all:unset;cursor:pointer;color:var(--acc);font-weight:600;padding:10px 0;display:inline-block}
.sheet h2{font:600 clamp(24px,4.5vw,34px)/1.1 Fraunces,Georgia,serif;margin:6px 0 2px}
.meta{color:var(--mute);font-size:14px;margin-bottom:14px}
.lines{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:var(--fs,16px);line-height:1.35;overflow-x:auto;padding-bottom:8px}
.lines div{white-space:pre;min-height:1.35em}
.lines .ch,.lines .mix{color:var(--ch);font-weight:700}
.lines .pair{white-space:normal;display:flex;flex-wrap:nowrap;align-items:flex-end;font-family:Inter,system-ui,sans-serif;margin-bottom:.15em}
.lines .w{display:inline-flex;align-items:flex-end;white-space:pre}
.lines.wrap .pair{flex-wrap:wrap}
.lines .sg{display:inline-flex;flex-direction:column;white-space:pre}
.lines .sg b{color:var(--ch);font-weight:700;min-height:1.3em;font-size:.95em;width:0;overflow:visible;white-space:nowrap}
.lines .sg b:empty{padding-right:0}
.lines .sg>span{min-height:1.35em}
.lines .mix.at{font-family:Inter,system-ui,sans-serif;white-space:pre-wrap}
.lines .ghost{visibility:hidden}
.lines .sec{font-family:Inter;font-weight:600;color:var(--acc);margin-top:.7em;font-size:.85em}
.lines .sec:first-child{margin-top:0}
.lines .gap{min-height:.4em}
.lines.singer{font-family:Inter;font-size:var(--fs,16px);line-height:1.5}
.lines.singer div{white-space:pre-wrap}
.lines.singer.measure div{white-space:pre;width:max-content}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(4vw,12px) calc(10px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.bar button{font:600 15px Inter;min-width:44px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.bar .now{font:700 18px 'JetBrains Mono',monospace;color:var(--ch);min-width:72px;text-align:center}
.bar .on{background:var(--ch);color:var(--card);border-color:var(--ch)}
.tabs{display:flex;gap:4px;padding:0 max(5vw,16px);max-width:900px;margin:6px auto 0}
.tabs button{font:600 15px Inter,system-ui,sans-serif;padding:10px 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--mute);cursor:pointer}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.primary{font:600 15px Inter,system-ui,sans-serif;min-height:44px;padding:0 16px;border-radius:10px;border:0;background:var(--acc);color:#fff;cursor:pointer;margin:12px 0}
.danger{font:600 13px Inter;height:34px;padding:0 10px;border-radius:8px;border:0;background:#b42318;color:#fff;cursor:pointer}
.h2{font:600 clamp(24px,4.5vw,32px)/1.1 Fraunces,Georgia,serif;margin:6px 0 2px}
.form{display:grid;gap:12px;max-width:460px;margin:12px 0}
.form label{display:grid;gap:4px;font-size:14px;color:var(--mute)}
.newp{display:flex;gap:4px;align-items:center}.newp input{font:16px Inter;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:150px}.newp button{font:600 13px Inter;height:38px;min-width:38px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.edr input{font:16px Inter,system-ui,sans-serif;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:140px}
.form input,.form select,.edr select{font:16px Inter,system-ui,sans-serif;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.form button:not(.primary){font:600 14px Inter;min-height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.list li.ed{padding:12px 4px;border-bottom:1px solid var(--line)}
.edh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.edh>span>button,.edr>button{font:600 13px Inter;height:34px;min-width:34px;padding:0 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;margin-left:3px}
.rep{display:inline-block;min-width:28px;text-align:center;font:700 14px Inter;color:var(--ch)}
.sugg{margin:-6px 0 0;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px}.sugg:empty{display:none}.sugg li:last-child>button{border-bottom:0}
.pv{all:unset;cursor:pointer;display:grid;gap:2px;min-width:0;flex:1}.pv small{color:var(--mute);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvb{margin:8px 0 2px;padding:8px 10px;border-left:3px solid var(--acc);background:var(--card);border-radius:0 8px 8px 0;font-size:14px;line-height:1.45}
.edh>span{flex:none;display:flex;align-items:center}
.hist{display:grid;gap:4px;margin:10px 0 4px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:15px}.hist .sub{font-size:13px;margin-right:4px}.kc{color:var(--ch);font-family:'JetBrains Mono',monospace}
.snav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:28px 0 8px}
.snav button{display:grid;gap:2px;text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font:600 16px Inter,system-ui,sans-serif;min-height:64px}
.snav .nx{text-align:right;border-color:var(--acc)}.snav small{font:500 13px Inter;color:var(--mute)}.snav .nx small{color:var(--acc)}
.pp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px;padding-top:6px;border-top:1px solid var(--line)}.pp select{font:15px Inter;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.edr{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-top:8px}
.edr label{display:grid;gap:2px;font-size:12px;color:var(--mute)}
.askf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 8px}
.askf input{font:16px Inter;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:170px}
.askf .primary{margin:0;min-height:36px}
.askf button:not(.primary):not(.danger){font:600 13px Inter;height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.err{color:#b42318;font-size:14px}
.grp{display:flex;gap:6px;align-items:center}
.ctl{display:flex;gap:3px;align-items:center;flex-wrap:nowrap;overflow-x:auto;margin:0 0 14px;padding-bottom:2px}
.ctl button{flex:none;font:600 12.5px Inter,system-ui,sans-serif;height:34px;min-width:30px;padding:0 6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.ctl button:disabled{opacity:.4;cursor:default}
.ctl .on{background:var(--ch);color:var(--card);border-color:var(--ch)}
.ctl .now{flex:none;font:700 15px "JetBrains Mono",monospace;color:var(--ch);min-width:30px;text-align:center}
.ctl .sp{flex:1 0 4px}
[hidden]{display:none!important}
.note{color:var(--mute);font-size:13px;margin-top:24px}
@media(max-width:600px){.bar button{padding:0 9px}}
</style></head><body>

    bk.onclick=sesList;mc.onclick=()=>{setSM(r,'c');openSes(r)};mm.onclick=()=>{setSM(r,'m');openSes(r)};return}
  const rows=r.canciones.map((c,i)=>{const s=songBy(c.id);if(!s)return '';
    return edit?`<li class="ed"><div class="edh"><b>${i+1}. ${esc(s.titulo)}</b><span><button data-up="${i}" aria-label="Subir">▲</button><button data-dn="${i}" aria-label="Bajar">▼</button><button data-rm="${i}" aria-label="Quitar">✕</button></span></div>
      <div class="edr"><label>Tono<select data-k="${i}">${KEYS.map(k=>`<option${k===c.tono?' selected':''}>${k}</option>`).join('')}</select></label>
      <label>Dirige${psel(`data-q="${i}"`,c.quien)}</label>
      <button data-pa="${i}">Partes (${c.arr.length})</button></div></li>`
    :`<li><button data-o="${i}"><span><b>${i+1}. ${esc(s.titulo)}</b><small>Dirige ${esc(c.quien)}${JSON.stringify(c.arr)!==JSON.stringify(defArr(s))?' · orden modificado':''}</small></span><span class="key">${esc(c.tono)}</span></button></li>`}).join('');
  app.innerHTML=`<button class="back" id="bk">← Reuniones</button><h2 class="h2">${esc(r.nombre)}</h2><div class="meta">${esc(fmt(r.fecha))} · Dirige ${esc(r.director)}</div>
  ${edit?'':`<div class="ctl"><button id="sm2" title="Cambiar modo">${SMODE[r.id]==='m'?'Modo: Músico':'Modo: Cantante'} ⇄</button><span class="sp"></span><button id="ed">Editar</button><button id="del">Borrar</button></div><div id="ask"></div>`}
  <ul class="list">${rows||'<li class="sub">Sin canciones todavía.</li>'}</ul>
  ${edit?`<div class="form"><label>Agregar canción<input id="ad" type="search" autocomplete="off" placeholder="Buscar por nombre o frase de la letra"></label><ul class="list sugg" id="sg"></ul><button class="primary" id="ok">Listo</button></div>`:''}`;
  bk.onclick=sesList;
  if(!edit){
    app.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{const c=r.canciones[+b.dataset.o],s=songBy(c.id);const sh=(idx(c.tono.replace(/m$/,''))-idx(baseKey(s).replace(/m$/,''))+12)%12;openSesSong(r,+b.dataset.o)});
    sm2.onclick=()=>{setSM(r,SMODE[r.id]==='m'?'c':'m');openSes(r)};
    const ask=(what,go)=>{const a=document.getElementById('ask');a.innerHTML=`<form class="askf" id="af"><input id="kk" type="password" inputmode="numeric" maxlength="4" placeholder="Clave (4 números)" aria-label="Clave"><button class="primary">${what}</button><button type="button" id="cx">Cancelar</button><span id="er" class="err"></span></form>`;kk.focus();kk.oninput=()=>{kk.value=kk.value.replace(/\D/g,'').slice(0,4)};cx.onclick=()=>a.innerHTML='';af.onsubmit=e=>{e.preventDefault();if(kk.value===r.clave)go();else er.textContent='Clave incorrecta'}};
    ed.onclick=()=>ask('Editar',()=>openSes(r,true));
    del.onclick=()=>ask('Borrar',()=>{const a=document.getElementById('ask');a.innerHTML=`<div class="askf"><span>¿Borrar “${esc(r.nombre)}”?</span><button class="danger" id="y">Sí, borrar</button><button id="n">No</button></div>`;y.onclick=()=>{SES=SES.filter(x=>x!==r);saveSes();sesList()};n.onclick=()=>a.innerHTML=''});
  }else{
    const re=()=>{saveSes();openSes(r,true)};
    app.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;if(i>0){[r.canciones[i-1],r.canciones[i]]=[r.canciones[i],r.canciones[i-1]];re()}});
    app.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;if(i<r.canciones.length-1){[r.canciones[i+1],r.canciones[i]]=[r.canciones[i],r.canciones[i+1]];re()}});
    app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{r.canciones.splice(+b.dataset.rm,1);re()});
    app.querySelectorAll('[data-k]').forEach(x=>x.onchange=()=>{r.canciones[+x.dataset.k].tono=x.value;saveSes()});
    app.querySelectorAll('[data-q]').forEach(x=>wirePsel(x,v=>{r.canciones[+x.dataset.q].quien=v;saveSes()}));
    app.querySelectorAll('[data-pa]').forEach(b=>b.onclick=()=>parts(r,+b.dataset.pa));
    const addSong=s=>{const t=baseKey(s);r.canciones.push({id:s.id,tono:KEYS.includes(t)?t:(KEYS.find(k=>idx(k)===idx(t.replace(/m$/,'')))||'C'),quien:r.director,arr:defArr(s)});re()};
    const showSg=()=>{const q=ad.value.trim();if(!q){sg.innerHTML='';return}const f=find(q).slice(0,8);
      sg.innerHTML=f.map(({s,snip,who})=>`<li><button type="button" data-a="${esc(s.id)}"><span><b>${esc(s.titulo)}</b><small>${who?esc(who):snip?'“'+esc(snip)+'”':esc(s.interprete==='-'?'':s.interprete)}</small></span><span class="key">${esc(s.tono)}</span></button></li>`).join('')||'<li class="sub">Sin resultados</li>';
      sg.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>addSong(songBy(b.dataset.a)))};
    ad.oninput=showSg;
    ok.onclick=()=>{saveSes();openSes(r)};
  }}
const bText=b=>b?b.lines.map(l=>l.t==='pair'?l.segs.map(x=>x[1]).join(''):(l.t==='ly'?l.v:'')).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean):[];
function parts(r,i){const c=r.canciones[i],s=songBy(c.id),B=blocksOf(s).filter(b=>b.has),AB=blocksOf(s);
  app.innerHTML=`<button class="back" id="bk">← ${esc(r.nombre)}</button><h2 class="h2">${esc(s.titulo)}</h2><div class="meta">Orden de las partes · tono ${esc(c.tono)}</div>
  <ul class="list">${c.arr.map((e,j)=>`<li class="ed"><div class="edh"><button type="button" class="pv" data-v="${j}" aria-expanded="false"><b>${esc(base(e.label||'')||'(inicio)')}</b><small>${esc((bText(AB[e.src])[0]||'Sin letra (instrumental)'))}</small></button><span><button data-m="${j}" aria-label="Menos repeticiones">−</button><span class="rep">x${rOf(e)}</span><button data-p="${j}" aria-label="Más repeticiones">+</button><button data-u="${j}" aria-label="Subir">▲</button><button data-d="${j}" aria-label="Bajar">▼</button><button data-c="${j}" aria-label="Repetir">⧉</button><button data-x="${j}" aria-label="Quitar">✕</button></span></div><div class="pvb" hidden>${bText(AB[e.src]).map(t=>`<div>${esc(t)}</div>`).join('')||'<div>Sin letra (instrumental)</div>'}</div></li>`).join('')}</ul>
  <div class="form"><label>Agregar parte<select id="ap"><option value="">Elegir…</option>${B.map(b=>`<option value="${b.id}">${esc((b.label||'(inicio)')+' — '+(bText(b)[0]||'instrumental'))}</option>`).join('')}</select></label>
  <button id="rs">Volver al orden original</button><button class="primary" id="ok">Listo</button></div>`;
  const re=()=>{saveSes();parts(r,i)};bk.onclick=()=>openSes(r,true);ok.onclick=()=>openSes(r,true);
  rs.onclick=()=>{c.arr=defArr(s);re()};
  app.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const j=+b.dataset.u;if(j>0){[c.arr[j-1],c.arr[j]]=[c.arr[j],c.arr[j-1]];re()}});
  app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const j=+b.dataset.d;if(j<c.arr.length-1){[c.arr[j+1],c.arr[j]]=[c.arr[j],c.arr[j+1]];re()}});
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const j=+b.dataset.c;c.arr.splice(j+1,0,{...c.arr[j]});re()});
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const p=b.closest('li').querySelector('.pvb');p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden))});
  app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const e=c.arr[+b.dataset.m];e.rep=Math.max(1,rOf(e)-1);re()});
  app.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{const e=c.arr[+b.dataset.p];e.rep=Math.min(9,rOf(e)+1);re()});
  app.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{c.arr.splice(+b.dataset.x,1);re()});
  ap.onchange=()=>{const b=blocksOf(s)[+ap.value];if(b){c.arr.push({src:b.id,label:b.label,rep:1});re()}}}

function fixChords(box){box.querySelectorAll('.pair').forEach(p=>{let prev=null;p.querySelectorAll('.sg>b').forEach(b=>{if(!b.textContent)return;if(prev){const a=prev.getBoundingClientRect(),c=b.getBoundingClientRect();const need=a.left+prev.scrollWidth+6-c.left;if(Math.abs(a.top-c.top)<4&&need>0){const s=b.parentElement;s.style.marginLeft=(parseFloat(s.style.marginLeft||0)+need)+'px'}}prev=b})})}
function fitSheet(){const box=app.querySelector('.lines');if(!box)return;box.classList.remove('wrap');
  const avail=box.clientWidth,clear=()=>box.querySelectorAll('.sg').forEach(s=>s.style.marginLeft='');
  const widest=()=>{let w=0;box.querySelectorAll('.pair,.ch,.mix').forEach(r=>{w=Math.max(w,r.scrollWidth)});return w};
  const set=f=>{box.style.setProperty('--fs',f+'px');clear();fixChords(box)};
  let fs=16;
  for(let k=0;k<12;k++){set(fs);const w=widest();if(w<=avail+1)break;if(fs<=11)break;fs=Math.max(11,Math.floor(fs*Math.min(.97,avail/w)*10)/10)}
  const fin=Math.max(9,Math.min(40,fs+(st.adj||0)));set(fin);
  if(widest()>avail+1){box.classList.add('wrap');clear();fixChords(box)}}
function fitSinger(){const box=app.querySelector('.lines.singer');if(!box)return;box.classList.add('measure');
  const avail=box.clientWidth,widest=()=>{let w=0;box.querySelectorAll('div').forEach(r=>{w=Math.max(w,r.scrollWidth)});return w};
  let fs=26;for(let k=0;k<14;k++){box.style.setProperty('--fs',fs+'px');const w=widest();if(w<=avail+1||fs<=12)break;fs=Math.max(12,Math.floor(fs*Math.min(.97,avail/w)*10)/10)}
  box.style.setProperty('--fs',Math.max(10,Math.min(44,fs+(st.sadj||0)))+'px');box.classList.remove('measure')}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(st.song&&app.querySelector('.lines'))(st.mode==='m'?fitSheet:fitSinger)()},150)});
list();
}
</script></body></html>
